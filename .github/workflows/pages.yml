name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Action pins: v5 is the first major of checkout/setup-node to run on node24.
# v4 targeted node20 and the runners were force-upgrading it with a deprecation
# annotation on every job — a warning today, a hard failure on GitHub's
# timeline, which for this repo means no deploys (deploy needs [test, e2e]).
# Deliberately NOT the newest major: v5/v6/v7 are all node24, so the runway is
# identical, and checkout v6 reworked how credentials are persisted — which is
# the mechanism news.yml's `git push` rides on. Same benefit, smaller delta.
# (setup-node v5+ can auto-cache npm, but only when package.json declares a
# `packageManager`/`devEngines.packageManager` field. Ours declares neither, so
# nothing changes here — worth knowing if that field is ever added.)
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test

  # Browser smoke test — gates the deploy (deploy needs [test, e2e]), so a page
  # that fails to boot in a real browser never ships. Runs in parallel with test.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    # Two pushes seconds apart raced here on 2026-09-15: both runs passed test
    # and e2e, both force-pushed gh-pages, and the one that lost the ref lock
    # failed red ("cannot lock ref … is at X but expected Y") while the site
    # itself was fine — the newer commit had already deployed. gh-pages is
    # REGENERATED from main on every push (force_orphan below), so a superseded
    # deploy has nothing to contribute: cancel it rather than let it fail.
    # Scoped to this job on purpose — test and e2e still run to completion on
    # every commit, so each one is genuinely tested even when its deploy is
    # dropped.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Deploy web/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          # Publish as a single orphan commit instead of appending. gh-pages had
          # accumulated ~64 MB of portrait masters across its deploy history —
          # the same blobs main just shed, kept alive on the other branch.
          #
          # A history rewrite was the wrong tool there: the remote had nine
          # deploys a local backup didn't, so force-pushing a rewritten copy
          # would have destroyed real deployment history to save space on a
          # branch that is REGENERATED FROM main ON EVERY PUSH. Its history has
          # no information main does not already hold, so the cheap fix is to
          # stop keeping one.
          force_orphan: true
