name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test

  # Browser smoke test — gates the deploy (deploy needs [test, e2e]), so a page
  # that fails to boot in a real browser never ships. Runs in parallel with test.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy web/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          # Publish as a single orphan commit instead of appending. gh-pages had
          # accumulated ~64 MB of portrait masters across its deploy history —
          # the same blobs main just shed, kept alive on the other branch.
          #
          # A history rewrite was the wrong tool there: the remote had nine
          # deploys a local backup didn't, so force-pushing a rewritten copy
          # would have destroyed real deployment history to save space on a
          # branch that is REGENERATED FROM main ON EVERY PUSH. Its history has
          # no information main does not already hold, so the cheap fix is to
          # stop keeping one.
          force_orphan: true
